<!doctype html><meta charset="utf-8"><style>body{padding:25px;font:16px sans-serif}label{display:block;margin:12px}button{margin:10px;padding:10px}[hidden]{display:none!important}</style>
<h1>补全网申资料</h1>
<div role="tablist">
<button role="tab" aria-selected="true" onclick="show(0)">个人信息</button>
<button role="tab" aria-selected="false" onclick="show(1)">补充信息</button>
<button role="tab" aria-selected="false" onclick="show(2)">求职意向</button>
</div>
<form data-section="basic" id="panel0" onsubmit="event.preventDefault();sessionStorage.finalSubmits=+(sessionStorage.finalSubmits||0)+1">
<h2>个人信息</h2>
<label>手机号码<input id="phone" required></label>
<label>通讯地址<input id="address"></label>
<button type="button" onclick="sessionStorage.nextAttempts=+(sessionStorage.nextAttempts||0)+1;if(!document.querySelector('#phone').value){document.querySelector('#errors').textContent='手机号为必填项';document.querySelector('#phone').setAttribute('aria-invalid','true')}">下一步</button><div id="errors" role="alert"></div>
<button type="submit">立刻报名</button>
</form>
<section id="panel1" data-section="basic" hidden><h2>补充信息</h2>
<label>微信号<input id="wechat"></label>
<button type="button" aria-expanded="false" onclick="this.setAttribute('aria-expanded','true');document.querySelector('#links').hidden=false">作品集信息</button>
<div id="links" hidden><label>GitHub 地址<input id="github"></label></div>
</section>
<section id="panel2" data-section="intention" hidden><h2>求职意向</h2><label>期望城市<input id="city"></label><button onclick="sessionStorage.finalSubmits=+(sessionStorage.finalSubmits||0)+1">提交申请</button></section>
<script>function show(n){for(let i=0;i<3;i++){document.querySelector('#panel'+i).hidden=n!==i;document.querySelectorAll('[role=tab]')[i].setAttribute('aria-selected',String(n===i));}}</script>
