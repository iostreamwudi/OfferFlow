<!doctype html><meta charset="utf-8"><style>body{margin:0}.el-form-item{margin:200px 0 0 700px;width:220px}input{width:180px;height:35px}.el-select-dropdown{margin-left:700px;width:200px}li{padding:15px}[hidden]{display:none!important}</style>
<section data-section="basic"><h2>个人信息</h2><div class="el-form-item"><label class="el-form-item__label">性别</label><div class="el-select"><input id="gender" readonly aria-controls="choices" onclick="document.getElementById('choices').hidden=false"></div></div><ul id="choices" class="el-select-dropdown" role="listbox" hidden><li role="option" onclick="document.getElementById('gender').value='男';this.parentElement.hidden=true;window.received='男'">男</li><li role="option">女</li></ul></section>
<script>window.events=[];document.addEventListener('mousedown',e=>events.push([e.clientX,e.clientY,e.target.id,e.target.className]));</script>
